server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets: cache aggressively (filenames are content-hashed by Vite)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: let React Router handle unknown paths client-side
    location / {
        try_files $uri $uri/ /index.html;
    }
}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep Enchanted Canopy Sky Gradient -->
    <linearGradient id="forestSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#051312" />
      <stop offset="25%" stop-color="#0a2622" />
      <stop offset="55%" stop-color="#123d38" />
      <stop offset="85%" stop-color="#1c554c" />
      <stop offset="100%" stop-color="#2d7769" />
    </linearGradient>

    <!-- Rustic Treehouse Deck Gradient -->
    <linearGradient id="deckGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8c5828" />
      <stop offset="15%" stop-color="#6e421c" />
      <stop offset="55%" stop-color="#4d2b10" />
      <stop offset="100%" stop-color="#331b08" />
    </linearGradient>

    <!-- Deck Surface Top Highlight -->
    <linearGradient id="deckTopHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d19e" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#8c5828" stop-opacity="0" />
    </linearGradient>

    <!-- Bioluminescent Glows -->
    <radialGradient id="tealGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="25%" stop-color="#5de3ba" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#5de3ba" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#5de3ba" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="25%" stop-color="#fff59d" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#fbc02d" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fbc02d" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#2ecc71" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#2ecc71" stop-opacity="0" />
    </radialGradient>

    <!-- Magic Mushroom Cap Gradient -->
    <linearGradient id="shroomCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7675" />
      <stop offset="100%" stop-color="#d63031" />
    </linearGradient>
    <linearGradient id="shroomTealCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5de3ba" />
      <stop offset="100%" stop-color="#00b894" />
    </linearGradient>
  </defs>

  <!-- 1. Background Forest Wall -->
  <rect width="1920" height="1080" fill="url(#forestSky)" />

  <!-- Layer 1: Distant Ancient Tree Trunks -->
  <g opacity="0.3" fill="#04100e">
    <path d="M -80 730 C 60 450, 110 260, 220 120 C 260 280, 290 500, 360 730 Z" />
    <path d="M 420 730 C 470 520, 500 360, 560 200 C 600 340, 630 520, 680 730 Z" />
    <path d="M 1240 730 C 1280 500, 1310 320, 1370 160 C 1420 330, 1450 510, 1500 730 Z" />
    <path d="M 1580 730 C 1660 410, 1710 230, 1840 100 C 1870 310, 1920 520, 2020 730 Z" />
  </g>

  <!-- Layer 2: Canopy Leaves and Hanging Foliage Silhouettes -->
  <g opacity="0.55" fill="#08221e">
    <!-- Top Left Canopy Clump -->
    <path d="M 0 0 L 480 0 C 420 80, 380 160, 280 180 C 210 190, 140 170, 80 220 C 30 250, 10 290, 0 320 Z" />
    <!-- Top Right Canopy Clump -->
    <path d="M 1440 0 L 1920 0 L 1920 340 C 1900 290, 1850 250, 1780 230 C 1700 200, 1640 160, 1580 80 Z" />
    <!-- Center Top Hanging Leaves -->
    <path d="M 720 0 Q 960 140 1200 0 Z" />
  </g>

  <!-- Layer 3: Twisted Jungle Hanging Vines -->
  <g stroke="#164e43" stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M 160 0 Q 210 180 180 340 Q 160 440 190 560" />
    <path d="M 310 0 Q 280 140 320 280" />
    <path d="M 1620 0 Q 1580 160 1620 320 Q 1650 460 1600 580" />
    <path d="M 1760 0 Q 1800 150 1770 320" />
    <!-- Cross hanging swag garland -->
    <path d="M 180 340 Q 560 480 960 420 Q 1360 480 1620 320" stroke="#0e3730" stroke-width="2.5" stroke-dasharray="8,6" opacity="0.75" />
  </g>

  <!-- Fairy Lantern 1 (Left Vine) -->
  <g transform="translate(180, 340)">
    <line x1="0" y1="0" x2="0" y2="24" stroke="#8c5828" stroke-width="2" />
    <rect x="-15" y="24" width="30" height="42" rx="7" fill="#2d1d13" stroke="#8c5828" stroke-width="1.5" />
    <circle cx="0" cy="45" r="28" fill="url(#goldGlow)" />
    <circle cx="0" cy="45" r="7" fill="#ffffff" />
  </g>

  <!-- Fairy Lantern 2 (Right Vine) -->
  <g transform="translate(1620, 320)">
    <line x1="0" y1="0" x2="0" y2="26" stroke="#8c5828" stroke-width="2" />
    <rect x="-15" y="26" width="30" height="42" rx="7" fill="#2d1d13" stroke="#8c5828" stroke-width="1.5" />
    <circle cx="0" cy="47" r="28" fill="url(#tealGlow)" />
    <circle cx="0" cy="47" r="7" fill="#ffffff" />
  </g>

  <!-- Fireflies & Magical Forest Light Orbs -->
  <g>
    <!-- Firefly 1 -->
    <circle cx="260" cy="220" r="24" fill="url(#tealGlow)" />
    <circle cx="260" cy="220" r="4.5" fill="#ffffff" />
    <!-- Firefly 2 -->
    <circle cx="480" cy="160" r="20" fill="url(#goldGlow)" />
    <circle cx="480" cy="160" r="4" fill="#ffffff" />
    <!-- Firefly 3 -->
    <circle cx="740" cy="260" r="18" fill="url(#emeraldGlow)" />
    <circle cx="740" cy="260" r="3.5" fill="#ffffff" />
    <!-- Firefly 4 -->
    <circle cx="960" cy="150" r="22" fill="url(#tealGlow)" />
    <circle cx="960" cy="150" r="4" fill="#ffffff" />
    <!-- Firefly 5 -->
    <circle cx="1180" cy="220" r="26" fill="url(#goldGlow)" />
    <circle cx="1180" cy="220" r="5" fill="#ffffff" />
    <!-- Firefly 6 -->
    <circle cx="1420" cy="170" r="22" fill="url(#tealGlow)" />
    <circle cx="1420" cy="170" r="4" fill="#ffffff" />
    <!-- Firefly 7 -->
    <circle cx="1740" cy="240" r="20" fill="url(#goldGlow)" />
    <circle cx="1740" cy="240" r="3.5" fill="#ffffff" />
    <!-- Ambient micro sparkles -->
    <circle cx="340" cy="380" r="2.5" fill="#5de3ba" opacity="0.8" />
    <circle cx="620" cy="340" r="2" fill="#fff59d" opacity="0.9" />
    <circle cx="860" cy="390" r="2" fill="#5de3ba" opacity="0.75" />
    <circle cx="1080" cy="360" r="2.5" fill="#ffffff" opacity="0.85" />
    <circle cx="1320" cy="380" r="2" fill="#2ecc71" opacity="0.8" />
    <circle cx="1540" cy="420" r="2.5" fill="#fff59d" opacity="0.9" />
  </g>

  <!-- Left Side Glowing Cartoon Mushrooms (Nestled by Deck) -->
  <g transform="translate(90, 680)">
    <!-- Big Mushroom -->
    <path d="M 20 60 Q 25 35 30 20 Q 35 35 40 60 Z" fill="#f8efba" />
    <path d="M 0 20 C 5 -15, 55 -15, 60 20 Z" fill="url(#shroomCap)" />
    <circle cx="16" cy="6" r="4.5" fill="#ffffff" opacity="0.9" />
    <circle cx="34" cy="-1" r="5.5" fill="#ffffff" opacity="0.9" />
    <circle cx="48" cy="8" r="4" fill="#ffffff" opacity="0.9" />
    <circle cx="30" cy="10" r="22" fill="url(#goldGlow)" opacity="0.45" />

    <!-- Small Teal Mushroom -->
    <path d="M 65 60 Q 68 45 72 32 Q 76 45 80 60 Z" fill="#dff9fb" />
    <path d="M 52 32 C 55 10, 90 10, 94 32 Z" fill="url(#shroomTealCap)" />
    <circle cx="64" cy="22" r="3" fill="#ffffff" opacity="0.9" />
    <circle cx="78" cy="20" r="3.5" fill="#ffffff" opacity="0.9" />
    <circle cx="73" cy="24" r="16" fill="url(#tealGlow)" opacity="0.5" />
  </g>

  <!-- Right Side Glowing Cartoon Mushrooms -->
  <g transform="translate(1760, 680)">
    <!-- Big Teal Mushroom -->
    <path d="M 25 60 Q 30 35 35 18 Q 40 35 45 60 Z" fill="#dff9fb" />
    <path d="M 5 18 C 10 -15, 60 -15, 65 18 Z" fill="url(#shroomTealCap)" />
    <circle cx="20" cy="4" r="4.5" fill="#ffffff" opacity="0.9" />
    <circle cx="38" cy="-2" r="5" fill="#ffffff" opacity="0.9" />
    <circle cx="52" cy="7" r="4" fill="#ffffff" opacity="0.9" />
    <circle cx="35" cy="8" r="22" fill="url(#tealGlow)" opacity="0.55" />
  </g>

  <!-- 2. Treehouse Wooden Deck Surface (Bottom 32%) -->
  <g>
    <!-- Desk Base Planks -->
    <rect x="0" y="730" width="1920" height="350" fill="url(#deckGrad)" />

    <!-- Top Surface Bevel Highlight Line -->
    <rect x="0" y="730" width="1920" height="22" fill="url(#deckTopHighlight)" />
    <line x1="0" y1="730" x2="1920" y2="730" stroke="#ffd9a6" stroke-width="2.5" opacity="0.75" />

    <!-- Wooden Plank Lines with Depth Grooves -->
    <line x1="0" y1="815" x2="1920" y2="815" stroke="#2a1403" stroke-width="2.5" opacity="0.45" />
    <line x1="0" y1="816" x2="1920" y2="816" stroke="#9e6632" stroke-width="1" opacity="0.4" />

    <line x1="0" y1="900" x2="1920" y2="900" stroke="#2a1403" stroke-width="2.5" opacity="0.45" />
    <line x1="0" y1="901" x2="1920" y2="901" stroke="#9e6632" stroke-width="1" opacity="0.4" />

    <line x1="0" y1="990" x2="1920" y2="990" stroke="#2a1403" stroke-width="2.5" opacity="0.45" />
    <line x1="0" y1="991" x2="1920" y2="991" stroke="#9e6632" stroke-width="1" opacity="0.4" />

    <!-- Organic Wood Knots & Texture -->
    <ellipse cx="320" cy="775" rx="38" ry="9" fill="none" stroke="#2a1403" stroke-width="2" opacity="0.3" />
    <ellipse cx="1620" cy="860" rx="46" ry="10" fill="none" stroke="#2a1403" stroke-width="2" opacity="0.3" />
    <ellipse cx="880" cy="945" rx="52" ry="11" fill="none" stroke="#2a1403" stroke-width="2" opacity="0.25" />

    <!-- Soft Ambient Foliage Shadows on Deck Edges -->
    <path d="M 0 730 C 120 730, 180 770, 220 830 L 0 830 Z" fill="#140901" opacity="0.25" />
    <path d="M 1920 730 C 1800 730, 1740 770, 1700 830 L 1920 830 Z" fill="#140901" opacity="0.25" />

    <!-- Realistic Center Book Shadow Under Book Spread -->
    <ellipse cx="960" cy="746" rx="580" ry="26" fill="#180b03" opacity="0.5" />
    <ellipse cx="960" cy="743" rx="460" ry="15" fill="#0d0501" opacity="0.45" />
  </g>
</svg>

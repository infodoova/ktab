<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Midnight Royal Navy Gradient -->
    <linearGradient id="libraryNight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#060c1d" />
      <stop offset="35%" stop-color="#0c1735" />
      <stop offset="70%" stop-color="#152755" />
      <stop offset="100%" stop-color="#1f3773" />
    </linearGradient>

    <!-- Rich Mahogany Desk Surface -->
    <linearGradient id="mahoganyDesk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#69301f" />
      <stop offset="20%" stop-color="#4e2114" />
      <stop offset="65%" stop-color="#38150c" />
      <stop offset="100%" stop-color="#210a05" />
    </linearGradient>

    <!-- Desk Surface Top Highlight -->
    <linearGradient id="mahoganyTopHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3b087" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#69301f" stop-opacity="0" />
    </linearGradient>

    <!-- Warm Study Lamp Glow -->
    <radialGradient id="lampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="25%" stop-color="#fff9c4" stop-opacity="0.85" />
      <stop offset="55%" stop-color="#ffb74d" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ff9800" stop-opacity="0" />
    </radialGradient>

    <!-- Moon Glow -->
    <radialGradient id="libraryMoonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="65%" stop-color="#c7ecee" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#c7ecee" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Background Library Room -->
  <rect width="1920" height="1080" fill="url(#libraryNight)" />

  <!-- Arched Starlit Window in Center -->
  <g transform="translate(740, 60)">
    <!-- Arch Frame Outer Trim -->
    <path d="M -10 390 L -10 220 A 230 230 0 0 1 450 220 L 450 390 Z" fill="#030711" stroke="#374f80" stroke-width="8" />
    <!-- Glass Background: Deep Night Sky -->
    <path d="M 0 380 L 0 220 A 220 220 0 0 1 440 220 L 440 380 Z" fill="#04091a" />

    <!-- Crescent Moon Inside Window -->
    <g transform="translate(320, 140)">
      <circle cx="0" cy="0" r="42" fill="url(#libraryMoonGlow)" opacity="0.7" />
      <path d="M 18 -28 A 34 34 0 1 0 28 26 A 28 28 0 1 1 18 -28 Z" fill="#f5f6fa" />
    </g>

    <!-- Window Starlight Constellations -->
    <circle cx="90" cy="190" r="3" fill="#ffffff" />
    <circle cx="160" cy="110" r="3.5" fill="#ffffff" />
    <circle cx="210" cy="220" r="2.5" fill="#ffffff" />
    <circle cx="280" cy="90" r="3" fill="#ffffff" />
    <circle cx="120" cy="300" r="2.5" fill="#ffffff" />
    <circle cx="360" cy="260" r="3" fill="#ffffff" />
    <circle cx="70" cy="120" r="2" fill="#ffffff" opacity="0.8" />
    <circle cx="230" cy="150" r="2" fill="#ffffff" opacity="0.8" />
    <circle cx="390" cy="180" r="2.5" fill="#ffffff" opacity="0.8" />

    <!-- Window Muntin Bars (Arched Gothic Style) -->
    <line x1="220" y1="0" x2="220" y2="380" stroke="#374f80" stroke-width="5" />
    <line x1="0" y1="220" x2="440" y2="220" stroke="#374f80" stroke-width="5" />
    <line x1="0" y1="320" x2="440" y2="320" stroke="#374f80" stroke-width="4" />
    <circle cx="220" cy="220" r="10" fill="#374f80" />
  </g>

  <!-- Left Side Bookshelf with Colorful Book Spines -->
  <g transform="translate(0, 160)">
    <!-- Shelf Uprights & Plank -->
    <rect x="0" y="0" width="280" height="570" fill="#1b0e0a" opacity="0.9" />
    <rect x="0" y="180" width="280" height="20" fill="#381910" stroke="#4e2114" stroke-width="2" />
    <rect x="0" y="370" width="280" height="20" fill="#381910" stroke="#4e2114" stroke-width="2" />
    <rect x="0" y="550" width="280" height="20" fill="#381910" stroke="#4e2114" stroke-width="2" />

    <!-- Top Shelf Books -->
    <rect x="25" y="40" width="28" height="140" rx="3" fill="#e74c3c" />
    <rect x="57" y="25" width="34" height="155" rx="3" fill="#3498db" />
    <rect x="95" y="50" width="26" height="130" rx="3" fill="#f1c40f" />
    <rect x="125" y="30" width="32" height="150" rx="3" fill="#2ecc71" />
    <rect x="161" y="45" width="28" height="135" rx="3" fill="#9b59b6" />
    <rect x="193" y="20" width="38" height="160" rx="3" fill="#e67e22" />
    <rect x="235" y="55" width="26" height="125" rx="3" fill="#1abc9c" />

    <!-- Mid Shelf Books -->
    <rect x="20" y="220" width="32" height="150" rx="3" fill="#f39c12" />
    <rect x="56" y="240" width="28" height="130" rx="3" fill="#2980b9" />
    <rect x="88" y="210" width="36" height="160" rx="3" fill="#27ae60" />
    <rect x="128" y="235" width="30" height="135" rx="3" fill="#8e44ad" />
    <rect x="162" y="225" width="34" height="145" rx="3" fill="#c0392b" />
    <rect x="200" y="250" width="28" height="120" rx="3" fill="#16a085" />
    <!-- Tilted Book -->
    <g transform="translate(232, 260) rotate(14)">
      <rect x="0" y="0" width="26" height="120" rx="3" fill="#d35400" />
    </g>

    <!-- Bottom Shelf Books -->
    <rect x="25" y="410" width="36" height="140" rx="3" fill="#1abc9c" />
    <rect x="65" y="395" width="30" height="155" rx="3" fill="#e74c3c" />
    <rect x="99" y="420" width="28" height="130" rx="3" fill="#f1c40f" />
    <rect x="131" y="400" width="36" height="150" rx="3" fill="#3498db" />
    <rect x="171" y="415" width="32" height="135" rx="3" fill="#2ecc71" />
  </g>

  <!-- Right Side Bookshelf with Books -->
  <g transform="translate(1640, 160)">
    <!-- Shelf Uprights & Plank -->
    <rect x="0" y="0" width="280" height="570" fill="#1b0e0a" opacity="0.9" />
    <rect x="0" y="180" width="280" height="20" fill="#381910" stroke="#4e2114" stroke-width="2" />
    <rect x="0" y="370" width="280" height="20" fill="#381910" stroke="#4e2114" stroke-width="2" />
    <rect x="0" y="550" width="280" height="20" fill="#381910" stroke="#4e2114" stroke-width="2" />

    <!-- Top Shelf Books -->
    <rect x="20" y="30" width="34" height="150" rx="3" fill="#9b59b6" />
    <rect x="58" y="45" width="28" height="135" rx="3" fill="#e74c3c" />
    <rect x="90" y="20" width="36" height="160" rx="3" fill="#f39c12" />
    <rect x="130" y="50" width="28" height="130" rx="3" fill="#2ecc71" />
    <rect x="162" y="35" width="34" height="145" rx="3" fill="#3498db" />
    <rect x="200" y="25" width="32" height="155" rx="3" fill="#1abc9c" />

    <!-- Mid Shelf Books -->
    <rect x="22" y="230" width="30" height="140" rx="3" fill="#e67e22" />
    <rect x="56" y="215" width="36" height="155" rx="3" fill="#27ae60" />
    <rect x="96" y="240" width="28" height="130" rx="3" fill="#8e44ad" />
    <rect x="128" y="220" width="32" height="150" rx="3" fill="#c0392b" />
    <rect x="164" y="235" width="34" height="135" rx="3" fill="#2980b9" />
    <rect x="202" y="210" width="38" height="160" rx="3" fill="#f1c40f" />
  </g>

  <!-- Warm Reading Ambient Light Cone Center -->
  <ellipse cx="960" cy="730" rx="600" ry="240" fill="url(#lampGlow)" opacity="0.65" />

  <!-- 2. Mahogany Reading Desk Surface (Bottom 32%) -->
  <g>
    <!-- Desk Base Planks -->
    <rect x="0" y="730" width="1920" height="350" fill="url(#mahoganyDesk)" />

    <!-- Bevel Top Highlight -->
    <rect x="0" y="730" width="1920" height="22" fill="url(#mahoganyTopHighlight)" />
    <line x1="0" y1="730" x2="1920" y2="730" stroke="#f3b087" stroke-width="2.5" opacity="0.7" />

    <!-- Planks -->
    <line x1="0" y1="815" x2="1920" y2="815" stroke="#1c0702" stroke-width="2.5" opacity="0.45" />
    <line x1="0" y1="816" x2="1920" y2="816" stroke="#803822" stroke-width="1" opacity="0.35" />

    <line x1="0" y1="900" x2="1920" y2="900" stroke="#1c0702" stroke-width="2.5" opacity="0.45" />
    <line x1="0" y1="901" x2="1920" y2="901" stroke="#803822" stroke-width="1" opacity="0.35" />

    <line x1="0" y1="990" x2="1920" y2="990" stroke="#1c0702" stroke-width="2.5" opacity="0.45" />
    <line x1="0" y1="991" x2="1920" y2="991" stroke="#803822" stroke-width="1" opacity="0.35" />

    <!-- Wood Knots -->
    <ellipse cx="340" cy="775" rx="38" ry="8" fill="none" stroke="#1c0702" stroke-width="2" opacity="0.3" />
    <ellipse cx="1580" cy="860" rx="44" ry="9" fill="none" stroke="#1c0702" stroke-width="2" opacity="0.3" />

    <!-- Ambient Shadow Under Book -->
    <ellipse cx="960" cy="746" rx="580" ry="26" fill="#0a0201" opacity="0.6" />
    <ellipse cx="960" cy="743" rx="460" ry="15" fill="#000000" opacity="0.5" />
  </g>
</svg>
